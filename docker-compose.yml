services:
  aizuotu:
    image: ghcr.io/pelico/dianshangtu:latest
    container_name: aizuotu
    ports:
      - "8000:8000"
    environment:
      # 必设：用于加密存储网关 API Key 的主密钥（改成你自己的长随机字符串）
      APP_SECRET: "change-me-to-a-long-random-string"
      # 可选：设置后打开网页需要输入此访问密码
      APP_PASSWORD: ""
    volumes:
      - ./data:/data
    restart: unless-stopped
